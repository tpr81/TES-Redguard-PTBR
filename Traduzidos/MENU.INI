movie_name[0] = INTRO.SMK
movie_keys[0] = 1508,4502,5801
movie0_text[0] = 0,255,255,255,1543,1594,É o crepúsculo da Segunda Era, uma epoca de guerra
movie0_text[1] = 0,255,255,255,1602,1661,enquanto o Imperio de Tiber Septim avança pelos reinos de Tamriel
movie0_text[2] = 0,255,255,255,1666,1692,em uma gloriosa tentativa de conquista.
movie0_text[3] = 0,255,255,255,1702,1777,Septim enfrenta resistencia por todos os lados, mas nunca mais feroz do que em Paramo do Martelo
movie0_text[4] = 0,255,255,255,1783,1817,a terra ancestral dos Guardas Vermelhos.
movie0_text[5] = 0,255,255,255,1847,1898,O Alto Rei de Paramo do Martelo, Thassad II
movie0_text[6] = 0,255,255,255,1903,1975,resiste as invasoes imperiais enquanto ve outros reinos cairem
movie0_text[7] = 0,255,255,255,1982,2048,ate que, finalmente, sem aviso previo e surpreendentemente livre de traiçoes cortesas,
movie0_text[8] = 0,255,255,255,2053,2085,a morte cobra seu tributo.
movie0_text[9] = 0,255,255,255,2114,2167,Com seu Alto Rei morto, Paramo do Martelo fica enfraquecido
movie0_text[10] = 0,255,255,255,2177,2262,mergulhando em uma sangrenta guerra civil entre as Coroas, que lutam pela soberania de sua terra,
movie0_text[11] = 0,255,255,255,2267,2321,e os Antepassados, que finalmente aceitaram o governo do Imperador.
movie0_text[12] = 0,255,255,255,2346,2428,As Coroas, lideradas pelo herdeiro de Thassad, o Principe A'Tor, sao continuamente vitoriosas,
movie0_text[13] = 0,255,255,255,2433,2487,derramando o sangue dos Antepassados nas areias de Paramo do Martelo.
movie0_text[14] = 0,255,255,255,2511,2556,De sua sede de poder na cidade portuaria de Stros M'kai,
movie0_text[15] = 0,255,255,255,2563,2621,o Principe A'Tor lentamente reúne o reino destruido de seu pai.
movie0_text[16] = 0,255,255,255,2649,2720,Sentindo sua derrota iminente, os Antepassados fazem um pacto com o Imperador,
movie0_text[17] = 0,255,255,255,2727,2818,permitindo que ele traga seus exercitos, esmague as Coroas e governe Paramo do Martelo como seu proprio.
movie0_text[18] = 0,255,255,255,2840,2907,Os exercitos de Tiber Septim sao demais para as orgulhosas Coroas Guardas Vermelhas.
movie0_text[19] = 0,255,255,255,2932,3056,Tiber Septim envia seu melhor comandante, Lord Richton, a Stros M'Kai para acabar com o Principe A'tor e as Coroas.
movie0_text[20] = 0,255,255,255,3065,3123,O principe reúne suas forças para um confronto final.
movie0_text[21] = 0,255,255,255,3144,3232,Sabendo que a soberania de Paramo do Martelo esta em jogo, as forças das Coroas igualam o poder do Imperio
movie0_text[22] = 0,255,255,255,3237,3288,enfrentando-os no porto de Stros M'kai para a batalha final.
movie0_text[23] = 0,255,255,255,3306,3387,A luta e feroz. Lord Richton, tendo testemunhado anteriormente as vitorias do Principe no mar,
movie0_text[24] = 0,255,255,255,3393,3435,decide recorrer ao seu último recurso...
movie0_text[25] = 0,255,255,255,3455,3521,...o Dragao, Nafalilargus, orgulhosa joia da coroa imperial.
movie0_text[26] = 0,255,255,255,3532,3584,A'Tor ordena que seus arqueiros preparem suas armas...
movie0_text[27] = 0,255,255,255,3600,3648,...mas e abatido pelo assassino de Richton,
movie0_text[28] = 0,255,255,255,3658,3713,derrubado por uma flecha cujo veneno se espalha rapido demais.
movie0_text[29] = 0,255,255,255,3726,3831,O mago de A'Tor tenta salvar o Principe, mas o dragao acaba com sua magia, e a esperança de vitoria das Coroas,
movie0_text[30] = 0,255,255,255,3834,3869,em um único e ardente sopro.
movie0_text[31] = 0,255,255,255,3891,3972,Tendo conquistado as Coroas, as forças do Imperador reivindicam o governo de todo Paramo do Martelo.
movie0_text[32] = 0,255,255,255,3982,4085,Guarniçoes imperiais sao estabelecidas em cada cidade e o proprio Richton e nomeado Governador Provisorio de Stros M'Kai.
movie0_text[33] = 0,255,255,255,4105,4186,Os meses passam. Os Guardas Vermelhos de Paramo do Martelo, tanto Coroa quanto Antepassado,
movie0_text[34] = 0,255,255,255,4193,4294,aprendem a viver sob o novo governo imperial e Tiber Septim estende sua influencia ao resto de Tamriel.
movie0_text[35] = 0,255,255,255,4311,4386,So o destino fara com que tudo isso diga respeito ao nosso heroi, Cyrus,
movie0_text[36] = 0,255,255,255,4396,4488,um Guarda Vermelho que ha muito deixou Paramo do Martelo para vagar pelas terras fronteiriças do Imperio.
movie0_text[37] = 1,255,255,0,4502,4576,Sorria, Cyrus. Esta e a desculpa que voce estava procurando.
movie0_text[38] = 0,255,0,0,4577,4609,Seja breve, S'rathra, tenho trabalho a fazer.
movie0_text[39] = 1,255,255,0,4612,4645,Todos os mercenarios sao iguais.
movie0_text[40] = 1,255,255,0,4661,4672,Sente-se.
movie0_text[41] = 0,255,0,0,4694,4721,Vou com os homens de Duadeen em uma hora.
movie0_text[42] = 1,255,255,0,4736,4851,Arruaceiros na noite, carregados de moedas imperiais, atras de algum pobre fazendeiro que deve ao reino ate sua esposa.
movie0_text[43] = 0,255,0,0,4861,4886,Voce deveria saber. Foi voce quem conseguiu o trabalho para mim.
movie0_text[44] = 1,255,255,0,4898,4941,E agora ele tira isso de voce. Por sua causa.
movie0_text[45] = 1,255,255,0,4981,5064,S'rathra sabe que voce disse que nunca voltaria a Paramo do Martelo, mas isso parecia importante.
movie0_text[46] = 0,255,0,0,5080,5094,O selo esta rompido.
movie0_text[47] = 1,255,255,0,5104,5141,S'rathra estava preocupado.
movie0_text[48] = 0,255,0,0,5150,5167,Sim, claro que estava.
movie0_text[49] = 1,255,255,0,5176,5263,Nao se preocupe com Duadeen. S'rathra resolve. S'rathra resolve tudo.
movie0_text[51] = 1,255,255,0,5294,5339,O desaparecimento de sua irma provoca arrepios.
movie0_text[52] = 0,255,0,0,5375,5386,Preciso de um navio.
movie0_text[53] = 1,255,255,0,5398,5473,O porto esta cheio deles e o nome de S'rathra ajuda a conseguir um bom preço.
movie0_text[54] = 0,255,0,0,5506,5515,Dinheiro, tambem.
movie0_text[55] = 1,255,255,0,5522,5651,Fique com o adiantamento de Duadeen. É um assunto de familia, afinal. Diga-me, S'Rathra, por que voce nunca mencionou sua irma antes?
movie0_text[56] = 0,255,0,0,5655,5687,Nao nos falamos ha dez anos. Houve problemas.
movie0_text[57] = 1,255,255,0,5711,5733,Que tipo?
movie0_text[58] = 0,255,0,0,5734,5747,Matei o marido dela.
movie0_text[59] = 0,255,255,255,5854,5917,O filho prodigo de Paramo do Martelo, Cyrus, retorna a provincia de seu nascimento.
movie0_text[60] = 0,255,255,255,5929,6006,Compra uma passagem para a ilha de Stros M'Kai, na esperança de resgatar sua irma,
movie0_text[62] = 0,0,255,255,6281,6355,"Abaixo" foi o que o pirata disse aos novatos diante dele
movie0_text[63] = 0,255,0,255,6357,6406,A Restless League reivindica esta carga.
movie0_text[64] = 0,0,255,255,6412,6468,disse o outro com uma clareza cruel, cruel.
movie0_text[65] = 0,255,0,0,6500,6546,Provavelmente nao faria diferença se eu dissesse que nao tenho tempo para isso.
movie0_text[66] = 0,255,0,255,6548,6612,Isso e sobre a honra dos Guardas Vermelhos, garoto, saia da frente.
movie0_text[67] = 0,0,255,255,6616,6703,Sim, uma noçao duvidosa e misturar pirataria e politica, mas ai esta.
movie0_text[68] = 0,255,0,0,6704,6756,Nunca me interessei por politica. No meu tempo, pirataria era um trabalho honesto.
movie0_text[69] = 0,255,0,255,6756,6789,Nao seja um heroi, garoto.
movie0_text[70] = 0,255,0,0,6791,6806,Onde esta o dinheiro nisso?
movie0_text[71] = 0,0,255,255,6809,6895,E eis que, por sua bravura, ficaram impressionados... por alguns poucos segundos....
movie1_text[0] = 0,255,0,0,95,110,Onde ela esta?
movie1_text[1] = 0,255,0,255,131,162,Nao sei. Esperava que isso me dissesse.
movie1_text[2] = 0,255,0,0,162,178,O que voce sabe, entao?
movie1_text[3] = 0,255,0,255,204,243,Quando Iszara se juntou a Liga, ela mudou de rosto.
movie1_text[4] = 0,255,0,255,250,282,Fez com que o Principe A'tor nos desse atençao.
movie1_text[5] = 0,255,0,255,290,375,Antes de Iszara, eramos um bando selvagem de nacionalistas com espadas afiadas e planos entusiasmados.
movie1_text[6] = 0,255,0,255,380,463,Nossa reputaçao duvidosa impediu A'tor de anunciar uma afiliaçao aberta, mas trabalhavamos para ele em segredo
movie1_text[7] = 0,255,0,255,470,553,eliminando traidores Antepassados no continente e matando emissarios imperiais que demoravam demais em nossas fronteiras.
movie1_text[8] = 0,255,0,0,557,592,E entao a guerra chegou a Stros M'kai.
movie1_text[9] = 0,255,0,255,596,657,Onde A'tor deveria ter vencido. Ele tinha o fogo de Hunding com ele naquele dia
movie1_text[10] = 0,255,0,255,659,701,ele teria expulsado Tiber Septim de Paramo do Martelo para sempre!
movie1_text[11] = 0,255,0,255,707,762,A Liga nao foi convidada para a Batalha por razoes de discriçao
movie1_text[12] = 0,255,0,255,767,835,e fomos obrigados a observar de longe! E naquela batalha vimos o rosto do Novo Imperio.
movie1_text[13] = 0,255,0,255,837,878,Enviaram um dragao, e nenhum homem pôde resistir a ele.
movie1_text[14] = 0,255,0,0,879,896,Ele matou o Principe A'tor?
movie1_text[15] = 0,255,0,255,902,939,A'tor desafiou a fera, mas nunca chegou ate ela.
movie1_text[16] = 0,255,0,255,944,1012,Uma flecha envenenada do capanga de Richton derrubou o Principe no momento em que ele avançava contra o dragao.
movie1_text[17] = 0,255,0,0,1013,1035,O que isso tem a ver com Iszara?
movie1_text[18] = 0,255,0,255,1044,1129,Enquanto A'tor jazia moribundo, seu mago, o arquimago Voa, tentou desesperadamente salvar sua vida.
movie1_text[19] = 0,255,0,255,1132,1165,O dragao estava sobre eles e havia pouco tempo.
movie1_text[20] = 0,255,0,255,1170,1227,Voa reuniu a força vital de A'tor em uma gema da alma no instante em que o fogo caiu.
movie1_text[21] = 0,255,0,255,1231,1288,A Batalha de Stros M'kai terminou entao, e começaram os problemas de Iszara.
movie1_text[22] = 0,255,0,0,1288,1305,Va direto ao ponto.
movie1_text[23] = 0,255,0,255,1324,1381,Em outra historia completamente diferente, a Liga conseguiu a gema da alma,
movie1_text[24] = 0,255,0,255,1383,1438,repositorio do poder do Principe, e começou a narrativa do pensamento ilusorio.
movie1_text[25] = 0,255,0,255,1447,1490,A Restless League agora tinha os meios para trazer o Principe de volta!
movie1_text[26] = 0,255,0,255,1493,1579,Poderiamos restaurar o Principe A'tor a partir da gema da alma e, sob seu estandarte, lutar na Batalha de Stros M'kai novamente,
movie1_text[27] = 0,255,0,255,1584,1606,desta vez corretamente ao lado dele!
movie1_text[28] = 0,255,0,255,1618,1641,E entao aquela pequena bruxa a roubou.
movie1_text[29] = 0,255,0,0,1645,1663,Iszara roubou a gema da alma?
movie1_text[30] = 0,255,0,255,1667,1694,E com ela o destino de Stros M'kai.
movie1_text[31] = 0,255,0,255,1705,1761,O espirito do Principe dentro daquela gema era a faisca para acender uma revoluçao.
movie1_text[32] = 0,255,0,255,1767,1817,Quando Iszara roubou a gema da alma, roubou-nos aquele fogo.
movie1_text[33] = 0,255,0,0,1818,1835,Para onde ela teria ido com ela?
movie1_text[34] = 0,255,0,255,1842,1925,Se soubessemos, voce nao estaria aqui agora. A única razao pela qual deixamos voce entrar no esconderijo foi para descobrir o que sabe...
movie1_text[35] = 0,255,0,255,1932,1992,...ou o que isso poderia nos dizer. Ambos parecemos continuar procurando nossas respostas.
movie1_text[36] = 0,255,0,0,2014,2059,Voltarei se voce estiver mentindo. E entao nao perdoarei ninguem.
movie1_text[37] = 0,255,0,255,2072,2107,Encontre a gema da alma e encontrara Iszara.
movie1_text[38] = 0,255,0,0,2141,2166,Leve-me de volta a Stros M'kai.
movie1_text[39] = 0,255,0,255,2174,2270,Isso e maior que sua irma, Guarda Vermelho. Lembre-se disso. Isso e sobre o reino!
movie1_text[40] = 0,255,0,255,2312,2343,Agora isso e sobre Paramo do Martelo.
movie1_text[41] = 0,255,0,255,2362,2375,Louco desgraçado.
movie1_text[42] = 0,0,255,255,2380,2434,Talvez exatamente o maldito louco de que precisamos para encontrar Iszara e a gema da alma.
movie1_text[43] = 0,255,0,255,2446,2457,Talvez sim....
movie2_text[0] = 0,255,255,0,854,864,Onde estou?
movie2_text[1] = 0,255,0,0,872,888,Voce esta segura, Iszara.
movie2_text[2] = 0,255,255,0,890,915,É voce?
movie2_text[3] = 0,255,0,0,917,932,Temo que sim.
movie2_text[4] = 0,255,255,0,938,972,Onde esta N'gasta? Ele esta morto? Onde esta a gema da alma?
movie2_text[5] = 0,255,0,0,978,989,Iszara, eu...
movie2_text[6] = 0,255,255,0,997,1021,Eu devo... devo voltar para a Liga.
movie2_text[7] = 0,255,0,0,1049,1053,Mas...
movie2_text[8] = 0,255,255,0,1059,1073,O que eu fiz?
movie2_text[9] = 0,255,0,0,1074,1084,Iszara!
movie2_text[10] = 0,255,255,0,1212,1234,Voce vem ou nao?
movie2_text[11] = 0,0,255,0,1366,1388,Ja ficou sabendo de tudo, hein?
movie2_text[12] = 0,255,0,0,1409,1422,Cale a boca.
movie2_text[13] = 0,255,0,0,1492,1502,Iszara...
movie2_text[14] = 0,255,255,0,1509,1534,Pensa em ficar desta vez?
movie2_text[15] = 0,255,0,0,1536,1545,Sim.
movie2_text[16] = 0,255,255,0,1554,1575,Porque voce poderia fugir de novo.
movie2_text[17] = 0,255,0,0,1588,1597,Sim.
movie2_text[18] = 0,255,255,0,1599,1616,Nao era sua guerra naquela epoca.
movie2_text[20] = 0,255,255,0,1623,1643,E nao e sua guerra agora.
movie2_text[22] = 0,255,255,0,1669,1727,E se espera algo alem disso agora, pode ir para o inferno.
movie2_text[23] = 0,255,0,255,1732,1757,Isso e otimo, Iszara.
movie2_text[24] = 0,255,255,0,1763,1834,Nao venha com isso. Mesmo se tivessemos a gema da alma, estariamos no mesmo lugar.
movie2_text[25] = 0,255,255,0,1845,1899,Voce continuaria escondida nesta caverna e Richton continuaria no palacio do nosso Principe.
movie2_text[26] = 0,255,0,255,1908,1990,Ha uma diferença entre se esconder do Imperio e Esperar, Nosso, Momento.
movie2_text[27] = 0,255,255,0,1996,2012,Estamos perdendo tempo.
movie2_text[28] = 0,255,0,255,2018,2057,Voce perdeu a gema da alma! E agora, garota?
movie2_text[29] = 0,255,0,0,2073,2089,Eu sei onde ela esta.
movie2_text[30] = 0,255,0,255,2093,2103,Ah, e?
movie2_text[31] = 0,255,0,0,2107,2137,Richton esta com a gema da alma.
movie2_text[32] = 0,255,0,255,2140,2158,Voce o viu com ela?
movie2_text[33] = 0,255,0,0,2161,2174,Eu a dei a ele.
movie2_text[34] = 0,255,255,0,2244,2255,Como voce pôde...?
movie2_text[35] = 0,255,0,0,2256,2328,Eu nao sabia o que era. O Necromante a transformou em um amuleto, um presente para o Governador.
movie2_text[36] = 0,255,0,0,2333,2396,Ele precisava de alguem para entrega-lo. Eu fiz isso, pensando que poderia chegar ate voce.
movie2_text[37] = 0,255,0,255,2403,2446,Voce acabou de partir meu coraçao. O seu tambem?
movie2_text[38] = 0,0,255,255,2449,2470,Em um milhao de pedaços.
movie2_text[39] = 0,255,0,0,2471,2491,Teremos que recupera-la.
movie2_text[40] = 0,255,0,255,2492,2530,Eles nos matarao assim que pisarmos na costa.
movie2_text[41] = 0,255,255,0,2531,2542,Cyrus tem razao.
movie2_text[42] = 0,255,0,0,2548,2624,De que adianta nos rotularem como rebeldes armados se nunca levantamos essas armas contra o Imperio?
movie2_text[43] = 0,255,0,255,2627,2636,"Nos"?
movie2_text[44] = 0,255,0,0,2640,2742,Estou lhe dizendo, Basil, e escute bem. Gostando ou nao, agora estou nisso, ate o fim.
movie2_text[45] = 0,255,0,255,2745,2832,Nao enviarei meus homens a Stros M'kai, com ou sem a gema da alma. Paramo do Martelo precisa de nos vivos.
movie2_text[46] = 0,255,0,0,2835,2910,De que voce serve, Basil, se nao faz nada? Tem medo de derramar um pouco de sangue?
movie2_text[47] = 0,255,255,0,2942,2956,La vem ele.
movie2_text[48] = 0,255,0,255,2957,3065,Voce fala muito bem sobre derramar sangue que nao e o seu, Cyrus. Quanto a Liga, fazemos o que podemos, mesmo escondidos.
movie2_text[49] = 0,255,0,255,3071,3257,Somos piratas, homem, a forma mais pura de sediçao: roubar, capturar, degolar sem sermos vistos; espinhos permanentes que mantem todos alertas, aliviando cada inercia com a nossa.
movie2_text[50] = 0,255,0,255,3263,3369,Nossas incursoes obrigam o Imperador a guarnecer Stros M'Kai, e a prender navios e homens aqui. E nossa pirataria atinge Richton onde mais doi...
movie2_text[51] = 0,255,0,255,3373,3476,em sua bolsa de ouro. Se ele nao espremer esta provincia para obter os lucros que o Imperador exige, SUA cabeça rolara.
movie2_text[52] = 0,255,0,0,3480,3550,Nao se esqueça do dragao, Basil. Porque ESSA e a coisa que voce realmente teme, nao e?
movie2_text[53] = 0,255,0,0,3555,3630,A Batalha de Stros M'Kai estava equilibrada ate o Governador chamar seu dragao, certo?
movie2_text[54] = 0,255,0,255,3632,3655,Bem, isso tambem.
movie2_text[55] = 0,255,0,0,3657,3677,Eu cuidarei do dragao.
movie2_text[56] = 0,255,0,255,3679,3696,Grandalhao.
movie2_text[57] = 0,0,255,255,3699,3721,Posso apalpar seus músculos?
movie2_text[58] = 0,255,255,0,3728,3784,Richton provavelmente tem o dragao guardando a gema da alma nos cofres do tesouro do Palacio.
movie2_text[59] = 0,255,0,0,3790,3798,Onde ficam?
movie2_text[60] = 0,255,255,0,3804,3847,Voce pode entrar pelas catacumbas, mas precisa da chave.
movie2_text[61] = 0,255,0,0,3864,3877,De onde voce tirou isso?
movie2_text[62] = 0,255,0,255,3880,3952,O Principe e sua irma eram bons amigos, Cyrus. Os cofres do tesouro seriam suas câmaras de joias.
movie2_text[63] = 0,255,0,0,3953,4035,Ja tive o bastante da sua conversa, Basil! Vou encontrar a gema e entao encontrarei alguem que traga o Principe de volta!
movie2_text[64] = 0,255,0,0,4036,4082,Quando isso estiver feito, devo dizer a ele para esperar sua ajuda ou nao?
movie2_text[65] = 0,255,0,255,4083,4132,ESPERO que voce tenha tanto sucesso quanto sua irma, Cyrus.
movie2_text[66] = 0,255,0,255,4141,4159,Dificilmente poderia fazer pior.
movie2_text[67] = 0,255,255,0,4164,4177,Nos iremos com voce.
movie2_text[68] = 0,255,0,0,4180,4282,Voce ainda esta fraca demais. Olhe, ate agora tenho me saido bem. Posso terminar isso. Por voce.
movie2_text[69] = 0,255,255,0,4288,4302,Por Paramo do Martelo.
movie2_text[70] = 0,255,0,0,4303,4318,Bem. Por Paramo do Martelo.
movie2_text[71] = 0,255,0,0,4327,4402,Quando eu tiver a gema da alma e alguem que possa quebrar sua magia, o que devo fazer?
movie2_text[72] = 0,255,255,0,4408,4469,Envie-nos o sinal e nos encontraremos no Templo. O Irmao Nidal escondeu o corpo de A'tor la.
movie2_text[73] = 0,255,0,255,4475,4539,Guarda Vermelho. Quando tiver o Principe, tera seus homens.
movie2_text[74] = 0,255,255,0,4603,4614,Isso deveria ajuda-lo.
movie2_text[75] = 0,255,0,0,4623,4666,Voce e conhecida demais na ilha. Os Imperiais...
movie2_text[76] = 0,255,255,0,4667,4678,Eu posso lidar com eles...
movie2_text[77] = 0,255,0,0,4684,4693,E voce vai.
movie2_text[78] = 0,255,0,0,4701,4713,Depois do templo.
movie2_text[79] = 0,255,0,0,4729,4776,Nao vou decepciona-lo. Nao como da última vez.
movie2_text[80] = 0,255,255,0,4780,4832,Olhe. Vamos deixar isso claro. Voce assassinou meu marido e fugiu.
movie2_text[81] = 0,255,255,0,4833,4903,Em um único dia, voce roubou de mim as duas pessoas que eu mais amava e em quem mais confiava neste mundo.
movie2_text[82] = 0,255,255,0,4907,4979,Hakan nao era um grande marido, mas voce nao era, nem e, quem para julga-lo.
movie2_text[83] = 0,255,255,0,4989,5082,Nem eu sou quem para julga-lo. Voce e culpado de sabe-se la quantos crimes e crueldades, sem contar o que fez com seu proprio sangue.
movie2_text[84] = 0,255,255,0,5099,5218,Mas... qualquer mal que voce tenha me causado, eu o perdoo. Voce e meu sangue, meu irmao mais novo, e nao posso fazer menos.
movie2_text[85] = 0,255,255,0,5228,5347,Mas se voce se intrometer nos assuntos da Liga, e no destino de Paramo do Martelo e seu povo, e depois fugir como da última vez, eu encontrarei voce.
movie2_text[86] = 0,255,255,0,5367,5448,Voce e um garoto encantador, vaidoso e egocentrico, que nunca pensa em ninguem alem de si mesmo e em seu proprio beneficio...
movie2_text[87] = 0,255,255,0,5468,5543,mas se aceitar isso, ira ate o fim... ou eu o matarei.
movie2_text[88] = 0,255,0,0,5553,5611,VOU encontrar essa gema da alma. E TRAREI seu Principe de volta.
movie2_text[89] = 0,255,0,0,5621,5708,Iszara. Sei o que voce pensa de mim. Nao tenho orgulho do que fui. Mas algo...
movie2_text[90] = 0,255,0,0,5718,5768,esta acontecendo aqui, e eu... nao sei realmente o que estou dizendo, mas...
movie2_text[91] = 0,255,255,0,5768,5810,Entao nao diga nada. Nao me interessam suas palavras, Cyrus.
movie2_text[92] = 0,255,255,0,5823,5914,É suficiente ter voce aqui. So preciso acreditar que voce ficara quando eu precisar de voce.
movie2_text[93] = 0,255,0,0,5923,5944,Eu vou terminar isso.
movie3_text[16] = 0,255,255,0,1863,1876,A gema da alma.
movie3_text[18] = 0,255,255,0,2372,2380,O anel.
movie3_text[20] = 0,255,0,255,3473,3498,O que aconteceu? Funcionou?
movie3_text[22] = 0,255,255,0,3563,3593,Sinto muito, Cyrus. O que aconteceu? O que ocorreu?
movie3_text[23] = 0,255,0,255,3597,3612,O que voce fez de errado?
movie3_text[24] = 0,255,255,0,3649,3661,Nao funcionou.
movie3_text[25] = 0,255,0,255,3695,3713,E agora, Guarda Vermelho?
movie3_text[26] = 0,255,0,0,3805,3828,A espada...
movie3_text[28] = 0,255,0,0,3870,3905,...a alma dele esta na espada.
movie3_text[29] = 0,255,255,0,3927,3932,Mae...?
movie3_text[30] = 0,255,0,0,3933,3948,Como isso aconteceu...?
movie3_text[32] = 0,255,255,0,3984,4013,Ela nao sabe. Foi
movie3_text[33] = 0,255,0,255,4014,4071,Quem se importa com o que aconteceu? Acabou, Cyrus. Nao podemos seguir uma espada.
movie3_text[34] = 0,255,0,255,4075,4103,Voce nos decepcionou. Isso acabou.
movie3_text[35] = 0,255,0,0,4140,4177,É assim que voce honrara seu Principe, entao?
movie3_text[36] = 0,255,0,0,4188,4237,Sempre achei voce cauteloso, Basil, mas nunca antes um covarde.
movie3_text[37] = 0,255,0,0,4268,4298,Todos nos esperamos pelo retorno do Principe.
movie3_text[38] = 0,255,0,0,4311,4338,Agora que ele voltou, voce recua.
movie3_text[39] = 0,255,0,0,4344,4382,A forma e diferente, certo, mas o espirito dele esta aqui, aqui.
movie3_text[40] = 0,255,0,0,4387,4419,E o espirito dele nao e a parte mais verdadeira dele?
movie3_text[41] = 0,255,0,0,4432,4517,Nao lhe ocorreu que talvez ele tenha escolhido esta forma e simbolo como sinal de suas intençoes?
movie3_text[42] = 0,255,0,0,4518,4611,Sim, talvez aquela alma, em um atraso odioso, presa em uma joia enquanto seus homens se escondiam e evitavam seus deveres
movie3_text[43] = 0,255,0,0,4611,4697,seu dever, talvez aquela alma tenha sido forjada para isso e nao por acaso venha ate voce agora
movie3_text[44] = 0,255,0,0,4700,4740,de nenhuma forma mais nobre e definitiva que esta
movie3_text[45] = 0,255,0,0,4753,4764,uma espada.
movie3_text[46] = 0,255,0,0,4777,4849,Voce diz que nao pode seguir uma espada, pois eu digo que abandonou a sua por tempo demais!
movie3_text[47] = 0,255,0,0,4857,4880,Para que esta aqui senao para LUTAR!
movie3_text[48] = 0,255,0,0,4889,4958,Seu Principe mostrou a essencia de seu carater mais puro, SIM! no proprio metal!
movie3_text[49] = 0,255,0,0,4966,5050,E a mensagem desta lâmina verdadeira e certeira e clara alem das palavras, pois agora nao e hora de palavras,
movie3_text[50] = 0,255,0,0,5053,5098,mas de maos corajosas, espadas brilhantes e sangue.
movie3_text[51] = 0,255,0,0,5106,5164,Sim, rapazes, agora e uma questao de sangue! Ha tempo demais congelado em suas veias!
movie3_text[52] = 0,255,0,0,5170,5256,E voce prefere permanecer rigido em vez de me seguir. Pois se nao o fizer,
movie3_text[53] = 0,255,0,0,5261,5297,saiba, com vergonha, que seu Principe o fara!
movie3_text[54] = 0,255,0,0,5302,5374,Pois seu sangue tambem e solido, mas endurecido como aço e temperado na morte!
movie3_text[55] = 0,255,0,0,5378,5451,Levantem-se como ele! como espadas! como Coroas iguais a ele!
movie3_text[56] = 0,255,0,0,5456,5478,O Principe morreu!
movie3_text[57] = 0,255,0,0,5488,5516,Viva o Principe!
movie3_text[58] = 0,255,0,255,5666,5680,O que faremos?
movie3_text[59] = 0,255,0,0,5688,5727,Voces garantirao o porto, nao podemos permitir que mais deles entrem.
movie3_text[60] = 0,255,0,0,5729,5775,Uma vez feito isso, ataquem os Imperiais que permanecerem na agua.
movie3_text[61] = 0,255,0,0,5778,5829,Quando virem que o porto e nosso, navegarao para terra firme.
movie3_text[62] = 0,255,255,0,5848,5859,E voce?
movie3_text[63] = 0,255,0,0,5863,5893,Vou ao Palacio matar o Governador.
movie3_text[64] = 0,255,255,0,5902,5919,Voce nao pode fazer isso sozinho.
movie3_text[65] = 0,255,255,0,5922,5936,Como entrara?
movie3_text[66] = 0,255,0,0,5943,5957,Nao estarei sozinho.
movie3_text[67] = 0,255,0,0,5976,6002,E o principe compartilha segredos.
movie3_text[68] = 0,255,255,0,6072,6089,Deixe-me ir com voce, Cyrus.
movie3_text[69] = 0,255,255,0,6121,6147,E voce nao ira sem mim.
movie3_text[70] = 0,255,0,0,6148,6179,Nao, ajude Basil e a Liga a tomar o porto.
movie3_text[71] = 0,255,0,0,6184,6246,Se atacarmos o Palacio, Richton e seus homens se entrincheirarao. Isso precisa terminar agora.
movie3_text[72] = 0,255,0,0,6250,6308,Com a Liga causando estragos na agua, o Palacio estara quase vazio enquanto tentam dete-los.
movie3_text[73] = 0,255,0,0,6313,6377,Chegarei facilmente ate Richton e o lembrarei de quem e o trono de Stros M'kai.
movie3_text[74] = 0,255,255,0,6386,6413,Eles saberao disso no restante de Paramo do Martelo.
movie3_text[75] = 0,255,0,0,6467,6488,Entao vamos garantir que seja estrondoso.
movie4_text[0] = 0,0,255,0,86,101,Que extraordinario.
movie4_text[1] = 0,0,255,0,111,173,Pode ser o primeiro Almirante Imperial a se render nesta altura.
movie4_text[2] = 0,255,0,0,175,211,Nao ha rendiçao, Governador. Voce apenas morrera de pe.
movie4_text[3] = 0,0,255,0,216,307,As Regras de Engajamento estabelecem claramente que o lado perdedor pode se render ao oponente no campo de batalha,
movie4_text[4] = 0,0,255,0,311,369,e que o vencedor pode, dentro do que e honroso, determinar seu resgate.
movie4_text[5] = 0,255,0,0,370,390,Lembre-me disso no Inferno.
movie4_text[6] = 0,0,255,0,391,414,Mas onde esta o beneficio nisso?
movie4_text[7] = 0,0,255,0,435,523,Ou a honra, Guarda Vermelho? Sei que um espadachim como voce nao pode matar um homem desarmado...
movie4_text[8] = 0,0,255,0,543,590,E como cavaleiro, coloco-me sob sua proteçao.
movie4_text[9] = 0,0,255,0,594,679,E como espadachim de habilidade nada desprezivel, parabenizo-o por seu dominio da espada longa.
movie4_text[10] = 0,0,255,0,682,733,E tambem o parabenizo por sua pequena vitoria aqui.
movie4_text[11] = 0,0,255,0,735,803,Fracassei com meu Imperador, e talvez lamente sobreviver para enfrentar seu descontentamento... mas...
movie4_text[12] = 0,255,0,255,819,834,Largue a arma.
movie4_text[13] = 0,255,0,0,915,944,Como eram mesmo aquelas Regras de Engajamento?
movie4_text[14] = 0,0,255,0,946,1007,Desculpe, Guarda Vermelho. As Regras governam os assuntos entre cavaleiros.
movie4_text[15] = 0,0,255,0,1014,1091,Mas voce, rebelde armado, traidor do Imperador e ameaça a sua paz...
movie4_text[16] = 0,0,255,0,1096,1132,Tudo o que voce conquistou foi uma execuçao sumaria.
movie4_text[17] = 0,255,0,255,1133,1160,Morra agora, Guarda Vermelho.
movie4_text[18] = 0,255,0,0,1161,1224,Faça isso entao, pois essa sera a parte facil. Mas olhe la embaixo, Richton.
movie4_text[19] = 0,255,0,0,1227,1297,Ali ha um exercito que provou a vitoria, e um que voce nunca mais derrotara.
movie4_text[20] = 0,0,255,0,1298,1309,Chega de palavras.
movie4_text[21] = 0,255,0,0,1317,1374,Richton, e hora de voce ver o fogo dos Guardas Vermelhos de que tanto ouviu falar.
movie4_text[22] = 0,255,0,0,1383,1440,Voce nunca matou o Principe, Richton. Ele vive!
movie4_text[23] = 0,0,255,0,1506,1518,Deuses.
movie4_text[24] = 0,0,255,255,2519,2563,O Bairro Antigo deveria estar restaurado para as celebraçoes, minha senhora.
movie4_text[25] = 0,255,255,0,2568,2602,Certifique-se de que o Capitao Basil tenha todos os homens de que precisar.
movie4_text[26] = 0,255,0,0,2664,2686,Sabe que preciso partir em breve.
movie4_text[27] = 0,255,255,0,2693,2755,Nao pode ficar ao menos para as celebraçoes? Elas sao por sua causa, afinal.
movie4_text[28] = 0,255,255,0,2765,2864,O Barao Volag saiu de seu esconderijo para retomar Sentinel ao saber de nossa rebeliao. Tanto ele quanto o Imperador vem negociar os tratados.
movie4_text[29] = 0,255,0,0,2873,2893,O Imperador vem para ca?
movie4_text[30] = 0,255,255,0,2906,3028,Tivemos duas guerras sangrentas em dois anos, Cyrus. Um acordo com o Imperio precisa ser feito, mas pelo menos seremos aliados respeitados,
movie4_text[31] = 0,255,255,0,3029,3102,se tudo der certo, em vez de súditos explorados. A'tor me guia nisso.
movie4_text[32] = 0,255,0,0,3121,3149,Nunca fui bom em politica.
movie4_text[33] = 0,255,255,0,3151,3202,Eu o perdoo de qualquer maneira. Nao posso fazer menos.
